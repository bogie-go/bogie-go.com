<!doctype html>
<!-- Source for /og.png (1200x630). Render with:
     google-chrome --headless --window-size=1200,630 --hide-scrollbars --screenshot=og.png file:///.../design/og-source.html
     No version number here on purpose: the image is cached by social sites and would go stale. -->
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>og source</title>
<link rel="stylesheet" href="../fonts.css">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:#F2EEE5;color:#16181D;font-family:'Instrument Sans',sans-serif;position:relative}
.brand{position:absolute;left:72px;top:56px;display:flex;align-items:center;gap:14px}
.brand img{width:44px;height:47px;object-fit:contain}
.brand b{font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:40px;letter-spacing:.01em}
.url{position:absolute;right:72px;top:68px;font-family:'JetBrains Mono',monospace;font-size:20px;letter-spacing:.12em;text-transform:uppercase;color:#4A4E57}
h1{position:absolute;left:72px;top:140px;margin:0;white-space:nowrap;font-family:'Big Shoulders Display',sans-serif;font-weight:900;text-transform:uppercase;font-size:104px;line-height:.95;letter-spacing:-.005em}
h1 span{color:#E2531F}
.eyebrow{position:absolute;left:72px;top:476px;font-family:'JetBrains Mono',monospace;font-size:22px;letter-spacing:.1em;text-transform:uppercase;color:#B83A0B}
.sub{position:absolute;left:72px;top:520px;font-size:26px;color:#2B2E35}
.plate{position:absolute;right:56px;top:150px;width:380px;height:380px;border-radius:50%;background:#E4DCCB;display:flex;align-items:center;justify-content:center}
.plate img{width:330px;height:auto}
.track{position:absolute;left:0;right:0;bottom:0;height:22px;background:
 linear-gradient(#16181D,#16181D) 0 4px/100% 3px no-repeat,
 linear-gradient(#16181D,#16181D) 0 15px/100% 3px no-repeat,
 repeating-linear-gradient(90deg,#CFC6B4 0 10px,transparent 10px 34px) 0 0/100% 22px no-repeat}
</style></head><body>
<div class="brand"><img src="../favicon.png" alt=""><b>Bogie</b></div>
<div class="url">bogie-go.com</div>
<h1>A Go API service,<br><span>from zero<br>to production.</span></h1>
<div class="eyebrow">Conventions, laid on Go track.</div>
<div class="sub">A generator for Go services. Plain Go on Gin, sqlc and goose.</div>
<div class="plate"><img src="../bogie.webp" alt=""></div>
<div class="track"></div>
</body></html>
